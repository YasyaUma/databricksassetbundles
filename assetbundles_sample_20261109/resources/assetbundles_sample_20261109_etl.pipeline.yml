# The main pipeline for assetbundles_sample_20261109

resources:
  pipelines:
    assetbundles_sample_20261109_etl:
      name: assetbundles_sample_20261109_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/assetbundles_sample_20261109_etl"

      libraries:
        - glob:
            include: ../src/assetbundles_sample_20261109_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
